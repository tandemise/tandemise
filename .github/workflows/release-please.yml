name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger other
          # workflows, so the release PR would never get the required CI checks.
          # RELEASE_PLEASE_TOKEN (fine-grained PAT or GitHub App token with
          # contents + pull-requests write) avoids that.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  relay-image:
    name: Publish the relay image
    needs: release-please
    if: needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ghcr.io/tandemise/relay
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          docker build -f apps/relay/Dockerfile -t "ghcr.io/tandemise/relay:${version}" -t ghcr.io/tandemise/relay:latest .
          docker push "ghcr.io/tandemise/relay:${version}"
          docker push ghcr.io/tandemise/relay:latest

  desktop-packages:
    name: Desktop installers
    needs: release-please
    if: needs.release-please.outputs.release_created
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # Only the (optional) signing secrets, by name; nothing else is passed down.
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

  # A release created with GITHUB_TOKEN triggers no other workflow, so the
  # design package is published from here too; publish-design.yml skips a
  # version that is already on npm, so running on the release event as well
  # (when RELEASE_PLEASE_TOKEN creates it) is harmless.
  design-package:
    name: Publish @tandemise/design
    needs: release-please
    if: needs.release-please.outputs.release_created
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-design.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
