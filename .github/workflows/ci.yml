name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:boundaries
      - run: npm run check:design
      - run: npm run check:licenses
      - run: npm run check:windows-hide
      - run: npm run -w @tandemise/desktop typecheck

  checks:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "tandemise-ci"
          git config --global user.email "ci@tandemise.invalid"
          git config --global init.defaultBranch main
      - run: npm run check:offline

  # The design system's Storybook (packages/design): it must build, its stories
  # must typecheck, and every story must render with its play function passing
  # and no new axe violation, in light and dark. On main the built site is
  # handed to the Pages deploy below. Actions here are pinned to commit SHAs.
  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run -w @tandemise/design storybook:typecheck
      - run: npm run -w @tandemise/design storybook:build
      - name: Accessibility and interaction checks (headless Chrome)
        run: npm run -w @tandemise/design storybook:a11y
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: packages/design/storybook-static

  # Publishes the Storybook built above to GitHub Pages. Needs Pages enabled in
  # the repository settings with "GitHub Actions" as the source.
  storybook-pages:
    name: Publish Storybook
    needs: storybook
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # WCAG 2.1 AA in the real desktop window (scratch/acceptance/a11y): a seeded
  # install, every screen and state in light and dark, axe-core's A+AA rules,
  # landmarks and headings, control names, a scripted keyboard pass, reflow at
  # 320px and text spacing. Electron needs a display: xvfb provides one.
  a11y-desktop:
    name: Accessibility (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Electron's binary and its sandbox helper
        run: |
          node node_modules/electron/install.js
          sudo chown root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - run: npm run build
      - name: Configure git identity for the demo repository
        run: |
          git config --global user.name "tandemise-ci"
          git config --global user.email "ci@tandemise.invalid"
          git config --global init.defaultBranch main
      - name: Every screen, light and dark, under axe and the keyboard
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" node scratch/acceptance/a11y/run-all.mjs --keep-painting
        env:
          A11Y_EVIDENCE: ${{ runner.temp }}/a11y-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: a11y-desktop-evidence
          path: ${{ runner.temp }}/a11y-evidence
          if-no-files-found: ignore

  relay-image:
    name: Relay image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the relay image
        run: docker build -f apps/relay/Dockerfile -t relay:ci .
      - name: It starts and answers health
        run: |
          docker run -d --name relay-ci -e RELAY_HOST=0.0.0.0 -e RELAY_PUBLIC_URL=https://relay.example.com -p 8787:8787 relay:ci
          for i in $(seq 1 30); do curl -fsS localhost:8787/relay/v1/health && break; sleep 1; done
          curl -fsS localhost:8787/relay/v1/health
          docker logs relay-ci | grep -E '^Admin invite: TRI-'
          docker rm -f relay-ci
      - name: It is under 120 MB to pull (compressed)
        run: |
          size=$(docker save relay:ci | gzip -c | wc -c)
          echo "relay image, compressed: $size bytes"
          test "$size" -lt 125829120
